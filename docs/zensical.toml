[project]
site_name = "Dependicus"
site_url = "https://descriptinc.github.io/dependicus/"
repo_url = "https://github.com/descriptinc/dependicus"
repo_name = "descriptinc/dependicus"
edit_uri = "edit/main/docs/docs/"
nav = [
    { "Docs" = [
        { "Basics" = [
            { "What is Dependicus?" = "index.md" },
            { "Getting Started" = "gettingstarted.md" },
            { "Configuration" = "configuration.md" },
            { "CLI Reference" = "cli.md" },
            { "Continuous Integration" = "ci.md" },
            { "BasicCompliancePlugin" = "compliance.md" },
            { "SecurityPlugin" = "security.md" },
        ] },
        { "Tickets" = [
            { "Linear Issues" = "linearissues.md" },
            { "GitHub Issues" = "githubissues.md" },
        ] },
        { "Package Managers" = [
            { "Overview" = "package-managers.md" },
            { "Node.js" = "providers/node.md" },
            { "Mise" = "providers/mise.md" },
            { "Python (uv)" = "providers/uv.md" },
            { "Go" = "providers/go.md" },
            { "Rust (Cargo)" = "providers/rust.md" },
        ] },
        { "Guides" = [
            { "Writing Plugins" = "plugins.md" },
            { "Using Coding Agents" = "coding-agents.md" },
            { "Contributing" = "contributing.md" },
        ] },
        { "Comparisons" = [
            { "vs Renovate" = "dependicus-vs-renovate.md" },
            { "vs Dependabot" = "dependicus-vs-dependabot.md" },
        ] },
    ] },
    { "API" = "/dependicus/api/" },
    { "Dependencies" = "/dependicus/dependencies/" },
]

[project.theme]
logo = "images/logo.svg"
favicon = "images/favicon.svg"
features = [
    "navigation.footer",
    "navigation.tabs",
    "content.action.edit",
    "content.action.view",
    "content.tabs.link",
]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# Publish the docs in a form coding agents can consume directly: llms.txt as an
# index, llms-full.txt as the whole site in one Markdown file. Sections mirror
# the nav above.
[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Basics" = [
    "index.md",
    "gettingstarted.md",
    "configuration.md",
    "cli.md",
    "ci.md",
    "compliance.md",
    "security.md",
]
"Tickets" = ["linearissues.md", "githubissues.md"]
"Package managers" = ["package-managers.md", "providers/*.md"]
"Guides" = ["plugins.md", "coding-agents.md", "contributing.md"]
"Comparisons" = ["dependicus-vs-renovate.md", "dependicus-vs-dependabot.md"]

# Generate per-page social cards and the Open Graph and Twitter metadata that
# points at them, so links to the docs render with a preview.
[project.plugins.social]
